services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=taskmanagerdb
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - mysql
    volumes:
      - .:/var/www
    networks:
      - task-manager
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.0
    container_name: task-manager-db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=taskmanagerdb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task-manager

networks:
  task-manager:
    driver: bridge

volumes:
  mysql_data:
